name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 06h de Brasília: orçamento e execução
    - cron: "0 8 3 * *"   # dia 3 de cada mês: estrutura (SIORG)
    - cron: "0 8 12 * *"  # dia 12 de cada mês: ocupantes (SIAPE, publicado com ~2 meses de atraso) e partidos (TSE)
    - cron: "0 8 20 * *"  # dia 20 de cada mês: orçamento de anos anteriores (ajustes de fechamento) e IPCA
    - cron: "30 10 * * *" # todo dia, 07h30 de Brasília: Diário Oficial (nomeações, exonerações, decretos de estrutura)
  workflow_dispatch:
    inputs:
      fonte:
        description: Fonte a atualizar
        type: choice
        options: [tudo, siorg, orcamento, ocupantes, historico, dou]
        default: tudo

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.coleta.outputs.mudou }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Escolher fonte
        id: fonte
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then f="${{ inputs.fonte }}"
          elif [ "${{ github.event.schedule }}" = "0 8 3 * *" ]; then f=siorg
          elif [ "${{ github.event.schedule }}" = "0 8 12 * *" ]; then f=ocupantes
          elif [ "${{ github.event.schedule }}" = "0 8 20 * *" ]; then f=historico
          elif [ "${{ github.event.schedule }}" = "30 10 * * *" ]; then f=dou
          else f=orcamento; fi
          echo "fonte=$f" >> "$GITHUB_OUTPUT"

      # Um cache só para todas as fontes: a execução semanal do orçamento o mantém vivo (o GitHub apaga
      # caches sem uso há 7 dias). Evita rebaixar meses antigos de execução e os ~44 meses do SIAPE.
      - uses: actions/cache@v6
        with:
          path: data/bruto
          key: bruto-${{ github.run_id }}
          restore-keys: bruto-

      - name: Coletar e normalizar
        id: coleta
        run: |
          set +e
          python -m etl atualizar ${{ steps.fonte.outputs.fonte }} --sinalizar-mudanca
          codigo=$?
          set -e
          if [ $codigo -eq 3 ]; then echo "mudou=true" >> "$GITHUB_OUTPUT"
          elif [ $codigo -ne 0 ]; then exit $codigo
          else echo "mudou=false" >> "$GITHUB_OUTPUT"; fi

      - name: Validar
        run: |
          python -m etl validar > validacao.txt || { cat validacao.txt; exit 1; }
          cat validacao.txt
          if grep -q '^AVISO' validacao.txt; then
            { echo "A validação automática de $(date -I) encontrou pontos para revisão humana:"; echo; echo '```'; cat validacao.txt; echo '```';
              echo; echo "Edite os arquivos em \`data/curadoria/\` (ver README) e rode \`python -m etl validar\`."; } > corpo.md
            bash .github/scripts/issue.sh "Curadoria: pontos para revisão" corpo.md curadoria
          fi

      - name: Issue de curadoria do Diário Oficial
        if: hashFiles('data/bruto/dou/novos.md') != ''
        # apagado depois: o cache de data/bruto é compartilhado e a issue não pode se repetir em outra execução
        run: bash .github/scripts/issue.sh "DOU $(date -I): atos para revisão" data/bruto/dou/novos.md curadoria && rm data/bruto/dou/novos.md

      - name: Commit dos dados novos
        if: steps.coleta.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalizado data/curadoria/correspondencia_siorg_orcamento.yaml
          git commit -m "Dados: atualização automática (${{ steps.fonte.outputs.fonte }}, $(date -I))"
          git push

      - name: Alerta de falha
        if: failure()
        run: |
          { echo "A atualização automática falhou em $(date -I)."; echo;
            echo "Fonte: ${{ steps.fonte.outputs.fonte }}"; echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > corpo.md
          bash .github/scripts/issue.sh "Falha na atualização: ${{ steps.fonte.outputs.fonte }}" corpo.md coleta

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.mudou == 'true'
    uses: ./.github/workflows/publicar.yml
