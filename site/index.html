<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estrutura dos Ministérios</title>
<meta name="description" content="Estrutura, cargos, ocupantes e orçamento dos ministérios do Governo Federal, a partir de dados oficiais (SIORG e Portal da Transparência).">
<meta name="theme-color" content="#d21212">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script>
  // Aplica o tema salvo antes da pintura, para não piscar.
  try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
