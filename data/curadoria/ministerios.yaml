# Identidade persistente de cada ministério e suas versões ao longo do tempo.
# - `id` nunca muda, mesmo que o nome ou a sigla mudem (permite rastrear extinções e recriações).
# - `no_painel: true` coloca o ministério no escopo das coletas e do site.
# - Datas em AAAA-MM-DD. `valido_ate: null` = vigente.
# - `categoria`: ministerio | presidencia (órgão essencial da Presidência com status de ministério)
#   | orgao (outro órgão com status de ministério: AGU, CGU).
# - `valido_de: null` = o órgão já existia antes de 2003 (início da série). Não preencher por estimativa.
# - `categoria` numa versão sobrepõe a do órgão (ex.: secretarias da Presidência que viraram ministério).
# - Toda versão precisa de `fonte`.

